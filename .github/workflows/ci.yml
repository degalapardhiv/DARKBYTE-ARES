name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint Python
        run: ruff check backend engines integrations scripts tests

      - name: Run backend tests
        run: pytest -q

  frontend:
    name: Frontend · lint + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint TypeScript
        run: npm run lint

      - name: Run frontend tests
        run: npm run test

      - name: Build production console
        run: npm run build

  compose:
    name: Docker · validate Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate development Compose file
        run: docker compose config --quiet

      - name: Validate production overlay
        env:
          SECRET_KEY: ci-only-secret-key-with-more-than-32-characters
          POSTGRES_PASSWORD: ci-only-postgres-password
          ADMIN_EMAIL: ci-admin@ares.example.com
          ADMIN_PASSWORD: Ci-Only-Admin-Password-2026!
          ALLOWED_ORIGINS: https://ares.example.com
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

  containers:
    name: Docker · build images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha,scope=ares-api
          cache-to: type=gha,mode=max,scope=ares-api

      - name: Build console image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=ares-console
          cache-to: type=gha,mode=max,scope=ares-console
