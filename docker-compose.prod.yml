# Production hardening overlay. Use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Required host-provided values: SECRET_KEY, POSTGRES_PASSWORD, ADMIN_PASSWORD,
# ALLOWED_ORIGINS. The API refuses to boot in production with demo mode enabled,
# a weak secret or wildcard CORS origins.
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for production}
    ports: []

  redis:
    ports: []

  backend:
    environment:
      APP_ENV: production
      DEMO_MODE: "false"
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      SECRET_KEY: ${SECRET_KEY:?Set a unique SECRET_KEY of at least 32 characters}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL for the initial administrator}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a strong ADMIN_PASSWORD}
      ANALYST_EMAIL: ${ANALYST_EMAIL:-analyst@ares.example.com}
      ANALYST_PASSWORD: ${ANALYST_PASSWORD:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set the exact HTTPS origin of the console}
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
      ALLOW_LOOPBACK_LAB: ${ALLOW_LOOPBACK_LAB:-false}
    ports: []

  frontend:
    ports:
      - "${FRONTEND_PORT:-8080}:80"
